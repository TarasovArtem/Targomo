name: Cypress E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cypress-tests:
    name: Cypress - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    # cypress/included bundles Node, npm and matching pre-installed browser
    # binaries for the same Cypress version declared in package.json, so no
    # separate Node setup or binary caching step is needed.
    # Pinned to 14.x: Cypress 15.19.0 paired with the Firefox build in that
    # tag hits a reproducible upstream WebDriver BiDi launch bug in this
    # containerized setup ("browser never connected" /
    # "Cannot read properties of undefined (reading 'browsingContextGetTree')").
    container:
      image: cypress/included:14.5.4
      options: --shm-size=1gb
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      # baseUrl in cypress.config.js points at the externally hosted app,
      # so there is nothing to build or serve locally before running tests.
      - name: Run Cypress E2E tests (${{ matrix.browser }})
        run: npm run ${{ matrix.browser }}

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos-${{ matrix.browser }}
          path: cypress/videos
          if-no-files-found: ignore
