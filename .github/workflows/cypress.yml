name: Cypress E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Minimal permissions for what this workflow actually does: read the repo,
# read past workflow run/job history for flaky-test signal (actions: read),
# and post/update a PR comment with the AI analysis. Nothing here needs
# issues, checks, or any other write scope. AI analysis itself (see the "AI
# failure analysis" step below) calls the external Groq API directly over
# fetch, authenticated with its own AI_API_KEY (from the GROQ_API_KEY
# repository secret) - not GITHUB_TOKEN - so it needs no GitHub Actions
# permission of its own regardless of which AI_PROVIDER is configured.
# For pull_request runs triggered by a fork, GitHub forces GITHUB_TOKEN to
# read-only regardless of what's declared here - contents/actions are
# already read-only so unaffected; only the pull-requests: write comment
# step is fork-restricted (see that step below for how it's handled).
permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  # Pure-JS tests for scripts/ai/ (provider contract, MockProvider,
  # GroqProvider against a fake fetch, retry/error normalization, prompt
  # building, etc.) - see package.json's test:unit script for the exact
  # file glob. Deliberately its own job, not a step inside cypress-tests:
  # it needs no browser, no live app, and no `needs:` on the Cypress
  # matrix - it tests scripts/ai/ in isolation, so it starts immediately
  # and runs in parallel with Cypress - chrome/edge. Job id/name are both
  # fixed strings (no matrix), since branch protection's required status
  # checks match on the exact check name.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # Scoped down from the workflow-level permissions block above (which
    # exists for the Cypress jobs' GitHub Actions history/PR-comment
    # calls) to the one thing this job actually does: read the repo to
    # check it out. No GitHub API access, no PR comments, no secrets.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runs entirely offline: MockProvider makes no network requests, and
      # GroqProvider's own tests inject a fake fetch instead of calling the
      # real Groq API - no GROQ_API_KEY/AI_API_KEY is passed to this job,
      # so there is nothing here to authenticate with even if a test tried
      # to. No continue-on-error - a failing unit test must fail this job.
      - name: Run unit tests
        run: npm run test:unit

  cypress-tests:
    name: Cypress - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    # cypress/included bundles Node, npm and matching pre-installed browser
    # binaries for the same Cypress version declared in package.json, so no
    # separate Node setup or binary caching step is needed.
    container:
      image: cypress/included:15.19.0
      options: --shm-size=1gb
    strategy:
      fail-fast: false
      # Firefox is excluded here: running it inside this nested container
      # (a Docker container on top of the Actions runner's own container)
      # reliably hangs during WebDriver session creation and times out
      # after ~9-10 min, regardless of shm-size, seccomp, or retries —
      # a known class of Firefox-in-Docker sandboxing limitation, not a
      # config issue in this repo. Run it locally instead: npm run firefox.
      matrix:
        browser: [chrome, edge]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      # baseUrl in cypress.config.js points at the externally hosted app,
      # so there is nothing to build or serve locally before running tests.
      #
      # continue-on-error lets the job carry on into the AI analysis steps
      # below instead of stopping here. steps.run_tests.outcome records the
      # real pass/fail result (unaffected by continue-on-error, which only
      # overrides .conclusion) - the "Fail job on E2E failure" step at the
      # end of this job reads it to make sure the job still ends up failed.
      - name: Run Cypress E2E tests (${{ matrix.browser }})
        id: run_tests
        continue-on-error: true
        run: npm run ${{ matrix.browser }}

      # Everything below this point is additive failure diagnostics. None
      # of it can turn a failed E2E run into a passing job: continue-on-error
      # above only lets these steps execute, and steps.run_tests.outcome
      # (not the ambient failure()/success() functions, which would already
      # read as "success" once a continue-on-error step fails) is what the
      # final gate step below checks.

      - name: Collect structured failure context
        if: steps.run_tests.outcome == 'failure'
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: npm run ai:collect

      # Best-effort flaky-test signal: aggregated pass/fail counts for this
      # browser's job over its last 10 completed runs on main (GitHub
      # Actions run/job history via the API - no artifact downloads, no
      # external database). GITHUB_TOKEN is the default per-run token, not
      # a custom secret, so this runs the same for fork and same-repo PRs.
      # Entirely optional: any failure here (first-ever run, rate limit,
      # API error) writes { available: false } and this step still
      # succeeds - "AI failure analysis" below works with or without it.
      - name: Collect run history for flaky-test reasoning
        if: steps.run_tests.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_BROWSER: ${{ matrix.browser }}
        run: npm run ai:history

      # AI analysis goes through a provider-neutral abstraction (see
      # scripts/ai/providers/) - which provider is used is selected by
      # AI_PROVIDER, not hardcoded here. GitHub Actions uses the real Groq
      # provider (scripts/ai/providers/groq-provider.js); local development
      # and unit tests keep using AI_PROVIDER=mock (see README.md) - no
      # real Groq call ever happens outside this workflow. GROQ_API_KEY is
      # the GitHub repository secret; AI_API_KEY is the generic,
      # provider-neutral application env var GroqProvider actually reads
      # (see scripts/ai/config.js) - analyze-failure.js itself never learns
      # Groq's name. Deliberately no fallback to MockProvider if
      # GROQ_API_KEY is missing/invalid: a real-provider request that can't
      # authenticate should fail honestly (surfacing as "AI analysis
      # unavailable" in the artifact/PR comment via the existing
      # continue-on-error below), not silently produce a fabricated mock
      # analysis. Informational only: it never runs when tests pass, and
      # continue-on-error here means an AI provider failure can't add a
      # second, unrelated failure reason - the job still fails for the
      # original E2E reason via the gate step below either way.
      - name: AI failure analysis
        if: steps.run_tests.outcome == 'failure'
        continue-on-error: true
        env:
          AI_PROVIDER: groq
          AI_MODEL: openai/gpt-oss-120b
          AI_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run ai:analyze

      # Only ever runs for pull_request (never push/workflow_dispatch, where
      # there is no PR to comment on) and only once tests have failed.
      #
      # Fork PRs: GitHub does not expose repository secrets (GROQ_API_KEY)
      # to fork-triggered pull_request runs, so AI_API_KEY resolves empty
      # there - GroqProvider's own config validation rejects that as a
      # CONFIGURATION error (no fallback to MockProvider), and the AI
      # failure analysis step's continue-on-error means that shows up as
      # "AI analysis unavailable", not a crash and not a leaked secret.
      # Same-repo PRs get a real Groq-backed report. Either way,
      # reports/ai/ai-report.json may or may not exist by this point - what
      # is separately blocked for forks is posting the *comment*: GitHub
      # forces GITHUB_TOKEN to
      # read-only for fork-triggered pull_request runs regardless of the
      # `permissions:` block above, so the pull-requests: write comment API
      # call would 403 - that's caught and logged as a warning, not a job
      # failure. Intentionally not switching to pull_request_target to work
      # around this: that trigger runs workflow code from the base branch
      # against the fork's PR content, which is a materially different
      # trust boundary and out of scope for this change. Security wins over
      # getting a comment on every fork PR.
      - name: Comment AI analysis on PR
        if: steps.run_tests.outcome == 'failure' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'reports', 'ai', 'ai-report.json');
            if (!fs.existsSync(reportPath)) {
              core.notice('No reports/ai/ai-report.json (AI analysis could not be completed, or the run failed before this step) - skipping PR comment.');
              return;
            }

            let report;
            try {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } catch (err) {
              core.warning(`Could not parse ai-report.json: ${err.message}`);
              return;
            }

            if (!Array.isArray(report.results) || report.results.length === 0) {
              core.notice('ai-report.json has no results - skipping PR comment.');
              return;
            }

            const prNumber = context.payload.pull_request && context.payload.pull_request.number;
            if (!prNumber) {
              core.notice('No pull_request number in the event payload - skipping PR comment.');
              return;
            }

            const { formatComment, MARKER } = require(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'ai', 'format-pr-comment.js')
            );
            const { upsertPrComment } = require(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'ai', 'pr-comment-client.js')
            );
            const browser = process.env.TEST_BROWSER || 'unknown';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = formatComment({ browser, report, runUrl });
            const marker = MARKER(browser);

            try {
              // One comment per browser/job, identified by its hidden marker,
              // updated in place on retry instead of piling up new comments.
              const result = await upsertPrComment({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: prNumber,
                marker,
                body,
              });
              core.notice(`${result.action === 'created' ? 'Created' : 'Updated'} QA Agent comment for ${browser} (id ${result.id}).`);
            } catch (err) {
              // Most likely a fork PR, where GITHUB_TOKEN is forced
              // read-only - not a reason to fail the job.
              core.warning(`Could not post/update the PR comment: ${err.message}`);
            }

      # Mirror image of the step above: once a browser that previously
      # failed (and got a QA Agent comment) starts passing again, replace
      # that comment with a short "resolved" note instead of leaving a
      # stale failure analysis on the PR forever. Only touches a comment
      # that already exists for this browser - a PR that never failed gets
      # no comment at all, from either step.
      - name: Resolve QA Agent comment on PR
        if: steps.run_tests.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        with:
          script: |
            const path = require('path');

            const prNumber = context.payload.pull_request && context.payload.pull_request.number;
            if (!prNumber) {
              return;
            }

            const { formatResolvedComment, MARKER } = require(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'ai', 'format-pr-comment.js')
            );
            const { findMarkedComment } = require(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'ai', 'pr-comment-client.js')
            );
            const browser = process.env.TEST_BROWSER || 'unknown';
            const marker = MARKER(browser);

            try {
              const existing = await findMarkedComment({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: prNumber,
                marker,
              });
              if (!existing) {
                return; // this browser never failed on this PR - nothing to resolve
              }

              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              const body = formatResolvedComment({ browser, runUrl });
              // Already have the comment id from the lookup above - update it
              // directly rather than re-searching via upsertPrComment.
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.notice(`Marked QA Agent comment for ${browser} as resolved (id ${existing.id}).`);
            } catch (err) {
              core.warning(`Could not resolve the PR comment: ${err.message}`);
            }

      - name: Upload Cypress screenshots
        if: steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos-${{ matrix.browser }}
          path: cypress/videos
          if-no-files-found: ignore

      - name: Upload structured test report
        if: steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: cypress-report-${{ matrix.browser }}
          path: reports/cypress
          if-no-files-found: ignore

      - name: Upload AI failure context and analysis
        if: steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ai-report-${{ matrix.browser }}
          path: reports/ai
          if-no-files-found: ignore

      # The one step in this job allowed to actually fail it. Everything
      # above ran (or was skipped) without affecting job status; this is
      # the sole source of truth for whether the job conclusion is
      # failure, and it depends only on the original test outcome - never
      # on whether AI collection/analysis succeeded, failed, or was
      # skipped.
      - name: Fail job on E2E failure
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "Cypress E2E tests failed for browser '${{ matrix.browser }}'. See the report/screenshot/video artifacts (and AI analysis, if it ran) for details."
          exit 1
